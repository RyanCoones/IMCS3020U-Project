<!DOCTYPE html>
<html>
  <head>
    <title>CrossCheck</title>
    <script src="./tailwindcss_cdn.js"></script>
  </head>
  <body class="min-h-screen bg-gray-900 flex items-center justify-center py-1 px-6">
    
    <div class="bg-gray-800 rounded-2xl shadow-xl p-8 mx-3 w-full max-w-md text-center">

      <div class="mb-6">
        <h1 class="text-3xl font-semibold text-white mb-3">
          CrossCheck
        </h1>

        <p class="text-gray-300">
          Instantly analyze the credibility of news articles.
        </p>
      </div>

      <button id="checkButton" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">
        Check Current Page
      </button>

      <div id="resultField" class="mt-4 text-gray-300"></div>

    </div>

    <script src="popup.js"></script>
  </body>
</html>
