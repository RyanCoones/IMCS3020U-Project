<!-- UI redesigned with Claude AI — Carbon & Blue theme, Cognito PKCE auth, guest mode, AI explanation -->
<!DOCTYPE html>
<html>
  <head>
    <title>CrossCheck</title>
    <script src="./tailwindcss_cdn.js"></script>
  </head>
  <body class="bg-neutral-950 flex items-center justify-center py-4 px-4 w-70">

    <div class="p-px rounded-2xl bg-linear-to-b from-blue-500/20 to-transparent w-full">
      <div class="bg-neutral-900 rounded-2xl shadow-xl shadow-black/60 border border-neutral-800 p-7 w-full text-center">

        <div class="mb-5">
          <h1 class="text-2xl font-bold text-neutral-100 mb-2">
            <img src="./assets/crosscheck_logo.png" class="w-7 h-7 inline-block mr-2 align-middle">CrossCheck
          </h1>
          <p class="text-neutral-400 text-sm">
            Instantly analyze the credibility of news articles.
          </p>
        </div>

        <!-- Signed-out view -->
        <div id="authView">
          <button id="signInButton" class="w-full bg-blue-500 hover:bg-blue-400 active:scale-95 text-white py-2.5 rounded-lg font-semibold transition-all duration-150 cursor-pointer">
            Sign in to CrossCheck
          </button>
          <button id="guestButton" class="mt-2 w-full text-xs text-neutral-500 hover:text-neutral-300 transition cursor-pointer py-1">
            Continue as guest
          </button>
        </div>

        <!-- Signed-in / guest view -->
        <div id="appView" style="display:none">
          <!-- Logged-in bar -->
          <div id="userBar" style="display:none" class="items-center justify-between mb-4 bg-neutral-800 rounded-lg px-3 py-2">
            <span id="usernameLabel" class="text-sm text-neutral-300 truncate"></span>
            <button id="signOutButton" class="text-xs text-neutral-500 hover:text-neutral-300 transition cursor-pointer ml-2 shrink-0">Sign out</button>
          </div>
          <!-- Guest bar -->
          <div id="guestBar" style="display:none" class="items-center justify-between mb-4 bg-neutral-800/50 rounded-lg px-3 py-2">
            <span class="text-xs text-neutral-500">Checking as guest</span>
            <button id="signInFromGuestButton" class="text-xs text-blue-400 hover:text-blue-300 transition cursor-pointer ml-2 shrink-0">Sign in</button>
          </div>

          <button id="checkButton" class="w-full bg-blue-500 hover:bg-blue-400 active:scale-95 text-white py-2.5 rounded-lg font-semibold transition-all duration-150 cursor-pointer">
            Check Current Page
          </button>
          <div id="resultField" class="mt-3 text-left"></div>
        </div>

      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
